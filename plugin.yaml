id: flux
version: 0.5.0
name: Flux CD
icon: SiFlux
description: Flux CD is a continuous delivery tool for Kubernetes that ensures the cluster state matches the desired state defined in Git.
repository: github.com/mononendev/omniview-plugin-flux
website: fluxcd.io
category: cloud
license: Apache-2.0
author:
    name: Alex Mononen
    email: alex@mononen.dev
    url: https://mononen.dev
maintainers:
    - name: Alex Mononen
      email: alex@mononen.dev
tags:
    - flux
    - gitops
    - continuous-delivery
    - kubernetes
capabilities:
    - ui
    - tools
requires:
    connections:
        - plugin: kubernetes
          operations: [catalog, get, enumerate, update]
          resource_types:
              - "k8s:kustomize.toolkit.fluxcd.io/*"
              - "k8s:helm.toolkit.fluxcd.io/*"
              - "k8s:source.toolkit.fluxcd.io/*"
              - "k8s:notification.toolkit.fluxcd.io/*"
              - "k8s:image.toolkit.fluxcd.io/*"
theme:
    colors:
        primary: '#5468FF'
